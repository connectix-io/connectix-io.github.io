<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 61" width="190" height="61" role="img" aria-label="Connectix">
  <!-- The mark (connectix-mark.svg, scaled to 60px) and the word in Rubik 600.
       The word is live text: it renders in Rubik where the font is available
       (the site pages inline this SVG, so the web font applies) and in the
       fallback sans-serif elsewhere. -->
  <defs>
    <clipPath id="cx-logo-clip"><circle cx="60" cy="60" r="54"/></clipPath>
  </defs>
  <g transform="translate(0.5 0.5) scale(0.5)">
    <g clip-path="url(#cx-logo-clip)">
      <rect x="0" y="0" width="60" height="120" fill="#BFE4E6"/>
      <rect x="60" y="0" width="60" height="120" fill="#8FCDD0"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
      <path d="M60 28 L88 44 L60 60 L32 44 Z" fill="#6B7280"/>
      <path d="M32 44 L60 60 L60 94 L32 78 Z"/>
      <path d="M88 44 L60 60 L60 94 L88 78 Z"/>
    </g>
  </g>
  <text x="68" y="39" font-family="Rubik, 'Open Sans', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0.3" fill="#505c70">Connectix</text>
</svg>
